syntax = "proto3";

package gsr.protocol.v1;

option go_package = "github.com/cnooljaw/gsr/gate/gen/go/gsr/protocol/v1;protocolv1";

import "google/protobuf/descriptor.proto";

// Direction 表示线上消息的发送方向。
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_CLIENT_TO_SERVER = 1;
  DIRECTION_SERVER_TO_CLIENT = 2;
}

// Kind 表示一个协议消息是请求、通知、响应还是服务端推送。
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_REQUEST = 1;
  KIND_NOTIFY = 2;
  KIND_RESPONSE = 3;
  KIND_PUSH = 4;
}

// MessageRoute 将消息编号显式关联到对应的 Protobuf payload 类型。
message MessageRoute {
  string payload_type = 1;
  Direction direction = 2;
  Kind kind = 3;
}

// message_route 标注 MsgId 枚举值对应的 payload、方向和消息种类。
extend google.protobuf.EnumValueOptions {
  MessageRoute message_route = 50001;
}
