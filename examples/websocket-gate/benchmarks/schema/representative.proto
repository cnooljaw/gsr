syntax = "proto2";

package gsr.benchmark;

option go_package = "github.com/cnooljaw/gsr/examples/websocket-gate/benchmarks/gen/pb;benchpb";

// AddressBook 的字段、presence 和数据对应 cloudwu/sproto README。
message Person {
  required string name = 1;
  required int32 id = 2;
  optional string email = 3;
  message PhoneNumber {
    required string number = 1;
    optional int32 type = 2;
  }
  repeated PhoneNumber phone = 4;
}

message AddressBook {
  repeated Person person = 1;
}

message Item {
  optional uint32 id = 1;
  optional uint32 count = 2;
  optional sint32 power = 3;
}

// GameState 采用常见的标量状态、坐标、packed 数值数组及结构体列表。
message GameState {
  optional uint32 playerId = 1;
  optional uint32 tick = 2;
  optional uint32 hp = 3;
  optional uint32 mp = 4;
  optional uint32 level = 5;
  optional sint32 x = 6;
  optional sint32 y = 7;
  optional uint32 state = 8;
  repeated sint32 attributes = 9 [packed = true];
  repeated uint32 skillIds = 10 [packed = true];
  repeated Item items = 11;
  repeated string labels = 12;
}

message IntArrays {
  repeated sint32 values = 1 [packed = true];
}

message EchoRequest {
  optional string text = 1;
}
