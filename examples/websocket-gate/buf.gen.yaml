version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - github.com/cnooljaw/gsr/examples/websocket-gate/cmd/protoc-gen-gsr-registry
    out: gen/go
  - local: protoc-gen-es
    out: client/src/gen
    opt:
      - target=ts
      - import_extension=js
