syntax = "proto3";

package gsr.common.v1;

option go_package = "github.com/cnooljaw/gsr/protocol/gen/go/gsr/common/v1;commonv1";

import "gsr/protocol/v1/options.proto";

// MsgId 是通用连接协议使用的消息编号；业务编号由业务协议维护。
enum MsgId {
  MSG_ID_UNSPECIFIED = 0;
  reserved 1, 2; // 旧 Protobuf 握手编号不再使用，避免后续误复用。

  S2C_ERROR_RESPONSE = 9001 [
    (gsr.protocol.v1.message_route) = {
      payload_type: ".gsr.common.v1.ErrorResponse"
      direction: DIRECTION_SERVER_TO_CLIENT
      kind: KIND_RESPONSE
    }
  ];
}

// ErrorCode 表示协议处理未能获得正常业务结果时使用的通用错误类别。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_MESSAGE = 2;
  ERROR_CODE_INTERNAL = 3;
}

// Envelope 是一条完整 C/S 消息的 Protobuf 外层，不包含连接认证字段。
message Envelope {
  uint32 msg_id = 1;
  uint32 request_id = 2;
  bytes payload = 3;
}

// ErrorResponse 表示请求未能得到正常业务结果，不表示业务拒绝。
message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}
